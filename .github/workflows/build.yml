# Build Nintendo Switch games to unsigned IPA on macOS runners.
# Input: share.zip URL (or local NSP folder) for the game, prod.keys as BASE64_KEYS secret.
# Output: unsigned IPA artifact.
name: Build IPA

on:
  workflow_dispatch:
    inputs:
      method:
        description: 'How to provide the game files'
        type: choice
        required: true
        default: 'share_zip'
        options:
          - share_zip
          - local_folder
      source:
        description: 'share.zip download URL (when method=share_zip) or NSP folder path (when method=local_folder)'
        type: string
        required: true
      artifact_name:
        description: 'Output artifact name (without .ipa extension)'
        type: string
        required: true
        default: 'totk'
      platform:
        description: 'Target platform'
        type: choice
        required: true
        default: 'ios'
        options:
          - ios
          - mac
          - mac-app

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.inputs.artifact_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Toolchain: use default Xcode on macos-latest; Metal compiler check allows other versions via --allow-other-metal
  # Python runs from .venv; do not set PYTHONPATH or let setup-python inject its site-packages
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  # Homebrew
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # .NET
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  # Metal compiler check uses this
  PYTHONUNBUFFERED: 1
  # Allow Metal compiler version mismatch (Xcode 15.x on macos-latest vs dmsh_chain.lock's Xcode 27.2)
  # WARNING: Issue #242 reported corruption with untested compiler; cause unconfirmed.
  ALLOW_OTHER_METAL: 1

jobs:
  build-ipa:
    name: Build IPA (${{ github.event.inputs.artifact_name }})
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Remove .git directory to save space
        run: |
          rm -rf .git
          echo "Removed .git directory"

      - name: Install macOS dependencies (Homebrew)
        run: |
          brew install xcodegen zstd glslang p7zip dotnet@10
          # dotnet@10 is keg-only; link it for PATH
          brew link --force dotnet@10

      - name: Install Xcode Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -version
          xcrun metal --version
          python3 dm/gfx/tools/own_compilers.py --check-metal

      - name: Create Python virtual environment (.venv)
        run: |
          python3 -m venv .venv --copies
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          # Core dependencies from the build script
          pip install lz4 "capstone>=5,<6" fonttools
          # Additional dependencies for extraction, download, and tooling
          pip install nsz zbic boto3 botocore zstandard enlighten blessed prefixed jinxed wcwidth pycryptodome

      - name: Write PRODKEYS secret to prod.keys
        env:
          PRODKEYS: ${{ secrets.PRODKEYS }}
        run: |
          mkdir -p keys_input
          # PRODKEYS is raw text (not base64), write directly
          if [ -z "$PRODKEYS" ]; then
            echo "::error::PRODKEYS secret is not set"
            exit 1
          fi
          printf '%s' "$PRODKEYS" > keys_input/prod.keys
          echo "Wrote PRODKEYS secret to keys_input/prod.keys"
          # Verify it's a valid keys file
          if ! grep -q '^master_key_' keys_input/prod.keys; then
            echo "::warning::prod.keys may be invalid (no master_key_ found)"
          fi
          ls -lh keys_input/prod.keys

      - name: Prepare game input directory
        id: prep_game
        env:
          SOURCE: ${{ github.event.inputs.source }}
          METHOD: ${{ github.event.inputs.method }}
        run: |
          mkdir -p game_input
          if [ "$METHOD" = "share_zip" ]; then
            echo "Downloading share.zip from $SOURCE ..."
            # Use curl with follow redirects, resume support, stall detection, and generous timeout
            # -C - : resume from where we left off (if partial file exists)
            # --max-time 7200 : 2 hour total timeout for 15GB+ files
            # --speed-limit 1024 --speed-time 30 : fail if speed drops below 1KB/s for 30s
            # --retry 5 --retry-delay 10 --retry-all-errors : more retries on any error
            curl -L --fail --retry 5 --retry-delay 10 --retry-all-errors \
              -C - --max-time 7200 --speed-limit 1024 --speed-time 30 \
              -o game_input/share.zip "$SOURCE"
            echo "Extracting share.zip ..."
            # Extract to a dedicated subdirectory
            mkdir -p game_input/extracted
            7z x -ogame_input/extracted game_input/share.zip
            # Use the extraction directory directly as NSP_DIR
            # If there's a single subdirectory, use that; otherwise use extracted itself
            EXTRACTED_CONTENTS=$(find game_input/extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
            if [ "$EXTRACTED_CONTENTS" -eq 1 ]; then
              NSP_DIR=$(find game_input/extracted -mindepth 1 -maxdepth 1 -type d)
            else
              NSP_DIR=game_input/extracted
            fi
            echo "NSP_DIR=$NSP_DIR" >> "$GITHUB_OUTPUT"
            echo "Using NSP_DIR: $NSP_DIR"
            ls -la "$NSP_DIR"
          else
            # Local folder mode: use the provided path directly
            if [ ! -d "$SOURCE" ]; then
              echo "::error::Local folder not found: $SOURCE"
              exit 1
            fi
            echo "NSP_DIR=$SOURCE" >> "$GITHUB_OUTPUT"
          fi

      - name: Free maximum disk space before build
        if: github.event.inputs.method == 'share_zip'
        run: |
          echo "=== Initial disk usage ==="
          df -h /

          # Delete the downloaded archive (16 GB)
          if [ -f game_input/share.zip ]; then
            rm -f game_input/share.zip
            echo "Deleted game_input/share.zip"
          fi

          # === Remove Xcode components we don't need ===
          # Remove watchOS, tvOS SDKs (~3 GB)
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/WatchOS.platform 2>/dev/null || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/AppleTVOS.platform 2>/dev/null || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/AppleTVSimulator.platform 2>/dev/null || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/WatchSimulator.platform 2>/dev/null || true

          # Remove iOS simulators (~5-10 GB)
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*.simruntime 2>/dev/null || true

          # Remove Xcode documentation and apps (~1-2 GB)
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Documentation 2>/dev/null || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Applications 2>/dev/null || true

          # Remove unused iOS device support
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport/ 2>/dev/null || true

          # Remove language packs except English/Base (~500 MB)
          sudo find /Applications/Xcode*.app -name "*.lproj" -not -name "en.lproj" -not -name "Base.lproj" -exec rm -rf {} + 2>/dev/null || true

          # Remove macOS SDK if only building for iOS (saves ~2-3 GB)
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX*.sdk 2>/dev/null || true

          # Remove Xcode command line tools we don't need
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/usr/share/doc 2>/dev/null || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/Library/PrivateFrameworks 2>/dev/null || true

          # === Remove Homebrew cache and unused packages ===
          # Keep only what we installed: xcodegen, zstd, glslang, p7zip, dotnet@10
          brew list --formula | grep -vE '^(xcodegen|zstd|glslang|p7zip|dotnet@10)$' | xargs brew uninstall --force --ignore-dependencies 2>/dev/null || true
          brew cleanup --prune=all -s
          rm -rf "$(brew --cache)"

          # === Remove Android SDK (~6 GB) ===
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /opt/android-sdk
          sudo rm -rf /usr/local/lib/android

          # === Remove language runtimes we don't need ===
          # Remove Node.js (keep only if needed)
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          sudo rm -rf /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx 2>/dev/null || true

          # Remove Ruby gems cache
          sudo rm -rf /usr/local/lib/ruby/gems/*/cache 2>/dev/null || true

          # === Remove pip cache ===
          rm -rf ~/.cache/pip

          # === Remove .NET NuGet cache ===
          rm -rf ~/.nuget/packages
          rm -rf /usr/local/share/dotnet/sdk/NuGetFallbackFolder

          # === Remove Xcode derived data ===
          rm -rf ~/Library/Developer/Xcode/DerivedData

          # === Remove GitHub Actions tool cache (~5-10 GB) ===
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true

          # === Remove GitHub Actions runner tool cache ===
          sudo rm -rf /opt/runnercache 2>/dev/null || true

          echo "=== Final disk usage ==="
          df -h /

      - name: Create artifact and build directories
        run: |
          mkdir -p artifacts
          mkdir -p "${{ github.event.inputs.artifact_name }}_build"

      - name: Build IPA
        id: build
        env:
          NSP_DIR: ${{ steps.prep_game.outputs.NSP_DIR }}
          KEYS_PATH: keys_input/prod.keys
          PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          source .venv/bin/activate
          # --work-dir: all intermediate files (extracted game, shader caches, Xcode artifacts) go here
          # --out: final IPA lands directly in artifacts/ for upload
          # --romfs separate: keeps ~16 GB RomFS out of IPA (IPA ~2 GB instead of ~18 GB)
          # --allow-other-metal: allows Xcode 15.x on macos-latest (dmsh_chain.lock expects Xcode 27.2)
          python3 scripts/build_ipa_from_nsp.py "$NSP_DIR" \
            -k "$KEYS_PATH" \
            --platform "$PLATFORM" \
            --progress lines \
            --work-dir "./${{ github.event.inputs.artifact_name }}_build" \
            --out "./artifacts/${{ github.event.inputs.artifact_name }}.ipa" \
            --allow-other-metal \
            2>&1 | tee build.log

      - name: Verify IPA artifact
        id: verify_ipa
        env:
          ARTIFACT_NAME: ${{ github.event.inputs.artifact_name }}
        run: |
          IPA_PATH="artifacts/${ARTIFACT_NAME}.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA not found at $IPA_PATH"
            find . -name '*.ipa' -type f 2>/dev/null || echo "  (no .ipa files found)"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: ${{ steps.verify_ipa.outputs.IPA_PATH }}
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ github.event.inputs.artifact_name }}
          path: |
            build.log
            logs
          retention-days: 7